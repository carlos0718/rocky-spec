[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rocky-spec"
version = "0.9.0"
description = "Toolkit multi-agente para Spec-Driven Development — nivel Spec-Anchored. Bootstrapea proyectos con SPEC.md, CONSTITUTION.md, AGENTS.md y el resto del ciclo de vida, para el agente de código que elijas (Claude Code, Cursor, y más por venir)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Charly" }]
keywords = ["spec-driven-development", "sdd", "ai-agents", "claude", "cursor", "scaffolding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "art>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/carlos0718/rocky-spec"
Changelog = "https://github.com/carlos0718/rocky-spec/blob/master/CHANGELOG.md"

[project.scripts]
rocky = "rocky_spec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rocky_spec"]
